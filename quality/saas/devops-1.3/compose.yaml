name: devops-authoring-fixture
services:
  orders:
    image: ghcr.io/example/fixture@sha256:1111111111111111111111111111111111111111111111111111111111111111
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    environment:
      DB_POOL_MAX: "4"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
