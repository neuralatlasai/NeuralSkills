<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team invitation</title>
  <link rel="stylesheet" href="invitation-copy.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f5f2; color: #202d28; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 380px; padding: 28px; border: 1px solid #dfe4dd; border-radius: 16px; background: #fff; box-shadow: 0 8px 32px #253a2910; }
    .eyebrow { margin: 0 0 12px; color: #5e6d63; font-size: 11px; font-weight: 650; letter-spacing: .13em; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.025em; }
    .description { margin: 12px 0 24px; color: #5b685f; font-size: 14px; line-height: 1.65; }
    @media (max-width: 360px) { body { padding: 16px; } main { padding: 22px; } }
  </style>
  <script defer src="invitation-copy.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">TEAM RIVER</p>
    <h1>Invite your team</h1>
    <p class="description">Share an invitation link to bring your teammates into the workspace.</p>
    <invitation-copy link="https://example.test/invite/team-river"></invitation-copy>
  </main>
</body>
</html>
