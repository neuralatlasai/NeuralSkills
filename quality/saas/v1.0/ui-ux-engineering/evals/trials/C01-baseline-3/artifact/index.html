<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitation link</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">TEAM RIVER</p>
      <h1>Invite your team</h1>
      <p class="intro">Share an invitation link with the people you work with.</p>
      <div class="invitation-copy">
        <button id="copy-invitation" type="button">Copy invitation link</button>
        <p id="copy-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="manual-copy" class="manual-copy" hidden><span>Invitation link:</span> <a href="https://example.test/invite/team-river">https://example.test/invite/team-river</a></p>
      </div>
      <p class="hint">Anyone with this link can join your team.</p>
    </main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
