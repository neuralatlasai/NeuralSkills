<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find a field guide</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2754%27%3E%E2%86%9F%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script type="module" src="dist/app.js"></script></head>
<body><main>
<header><p class="eyebrow"><span aria-hidden="true">↟</span> THE FIELD LIBRARY</p><h1>Find a field guide</h1><p class="intro">A little knowledge for your next outdoor discovery.</p></header>
<form id="search-form"><label for="query">What would you like to explore?</label><div class="search-row"><input id="query" name="query" type="search" placeholder="Try cedar or moss" autocomplete="off" aria-describedby="search-hint"><button type="submit">Search</button></div><p id="search-hint" class="hint">Local demo · Try cedar, moss, empty, or fail.</p></form>
<section class="response" aria-labelledby="results-heading"><div class="section-label"><h2 id="results-heading">Your field notes start here</h2><span id="count" class="count" hidden></span></div><p id="status" role="status" aria-live="polite" aria-atomic="true">Search for a topic to discover a guide.</p><div id="results" aria-busy="false"></div><button id="retry" type="button" class="secondary" hidden>Retry</button></section>
<footer>Made for curious minds. Packed for the trail.</footer>
</main></body></html>
